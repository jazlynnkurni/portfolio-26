<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPhone preview</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#2a2826;color:#FAF9F7;font:500 13px "Plus Jakarta Sans",sans-serif;-webkit-font-smoothing:antialiased}
.top{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;justify-content:center;align-items:center;padding:14px;flex-wrap:wrap;z-index:2}
button{font:inherit;color:#FAF9F7;background:transparent;border:1px solid rgba(250,249,247,.22);border-radius:999px;padding:8px 14px;cursor:pointer}
button[aria-pressed=true]{background:#FAF9F7;color:#1C1A17;border-color:#FAF9F7}
.stage{min-height:100%;display:grid;place-items:center;padding:72px 0 40px;box-sizing:border-box}
/* iPhone 15: 393x852 logical, 55px corner, island 126x37 */
.phone{position:relative;width:393px;height:852px;border-radius:55px;background:#000;padding:0;box-shadow:0 0 0 11px #1a1a1a,0 0 0 13px #3b3b3b,0 40px 80px -20px rgba(0,0,0,.8)}
.phone iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:55px;background:#FAF9F7}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:999px;background:#000;z-index:3}
.btn{position:absolute;background:#2b2b2b;border-radius:2px}
.btn.l1{left:-16px;top:150px;width:3px;height:30px}.btn.l2{left:-16px;top:210px;width:3px;height:62px}.btn.l3{left:-16px;top:290px;width:3px;height:62px}
.btn.r{right:-16px;top:240px;width:3px;height:96px}
.size{font-size:11.5px;color:rgba(250,249,247,.5);margin-left:6px}
</style></head><body>
<div class="top">
  <button data-u="/">Home</button><button data-u="/?p=manus-ai">Manus sheet</button><button data-u="/?p=conduit-commerce">Conduit sheet</button><button data-u="/?p=somia-cx">Somia sheet</button><button data-u="/about.html">About</button><button data-u="/art-gallery.html">Gallery</button>
  <span class="size">·</span>
  <button data-t="light">Light</button><button data-t="dark">Dark</button>
  <span class="size">393 × 852, iPhone 15</span>
</div>
<div class="stage"><div class="phone"><div class="island"></div><div class="btn l1"></div><div class="btn l2"></div><div class="btn l3"></div><div class="btn r"></div><iframe id="f" title="site"></iframe></div></div>
<script>
const f=document.getElementById('f'); let u='/', t='light';
function go(){ const q=u.includes('?')?'&':'?'; f.src=u+q+'theme='+t; for(const b of document.querySelectorAll('button')) b.setAttribute('aria-pressed', b.dataset.u===u||b.dataset.t===t); }
document.querySelector('.top').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; if(b.dataset.u) u=b.dataset.u; if(b.dataset.t) t=b.dataset.t; go(); });
go();
</script>
</body></html>
