<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mark lab</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAF9F7;--ink:#14171B;--ink2:rgba(20,23,27,.66);--ink3:rgba(20,23,27,.42);--hair:rgba(20,23,27,.16);--jak:"Plus Jakarta Sans",sans-serif;--hel:"Helvetica Neue",Helvetica,Arial,sans-serif}
html[data-theme="dark"]{--paper:#1C1A17;--ink:#FAF9F7;--ink2:rgba(250,249,247,.66);--ink3:rgba(250,249,247,.42);--hair:rgba(250,249,247,.16)}
html,body{margin:0;background:var(--paper);color:var(--ink);font:300 14px/1.5 var(--hel);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:56px 30px 80px}
.label{font:600 10.5px/1.5 var(--jak);letter-spacing:.15em;text-transform:uppercase;color:var(--ink3)}
h1{font:500 clamp(28px,4vw,44px)/1.12 var(--jak);letter-spacing:-.012em;margin:12px 0 0;max-width:22ch}
p.lede{font-size:17px;line-height:1.62;color:var(--ink2);margin:16px 0 0;max-width:56ch}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
.cell{border:1px solid var(--hair);padding:18px;display:grid;gap:12px}
.plate{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--paper)}
.plate canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.cell h3{font:500 15px var(--jak);margin:0}
.cell p{margin:0;font-size:13px;line-height:1.55;color:var(--ink2)}
.cell .tiny{width:64px;height:64px;border-radius:14px;overflow:hidden;background:var(--paper);outline:1px solid var(--hair);outline-offset:-1px;position:relative}
.cell .tiny canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px}
label.chk{display:flex;gap:10px;align-items:center;font:500 12.5px var(--jak);margin-top:24px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div class="wrap">
  <div class="label">The mark · five ways to hold two discs</div>
  <h1>Green and purple, five compositions.</h1>
  <p class="lede">Same two riso sheets each time, only the placement changes. Each plate is the full mark; the small tile beside it is the same mark at favicon size. Drag a disc on any plate; it springs back.</p>
  <div class="grid" id="grid"></div>
  <label class="chk"><input id="dark" type="checkbox"> dark mode</label>
</div>
<script type="module">
import { mountSheets } from '/sheets-gl.js';
const G='#9ba69c', P='#827a85';
/* five placements, in unit x (y in the same unit; the plate is square) */
const VARIANTS=[
  { id:'kiss', name:'01 · Kiss', why:'Different sizes, the small one tucked low and right so the overlap is a sliver. Two things touching rather than a symbol.',
    discs:[{x:.42,y:.46,r:.27},{x:.66,y:.62,r:.18}], sw:[G,P] },
  { id:'stack', name:'02 · Stack', why:'One above the other, offset, the purple half hidden. Reads as sheets on a desk, which is what the hero is.',
    discs:[{x:.50,y:.40,r:.24},{x:.56,y:.60,r:.24}], sw:[P,G] },
  { id:'diag', name:'03 · Diagonal', why:'Corner to corner, the green leading, both cut by the tile edge so the mark feels bigger than the tile.',
    discs:[{x:.36,y:.36,r:.30},{x:.70,y:.70,r:.24}], sw:[G,P] },
  { id:'eclipse', name:'04 · Eclipse', why:'Purple large, green small and inside its edge, off to one side. The overlap is where the eye lands.',
    discs:[{x:.52,y:.50,r:.31},{x:.36,y:.42,r:.16}], sw:[P,G] },
  { id:'orbit', name:'05 · Orbit', why:'The two nearly apart, a hair of overlap high on the right, the small one lifting. The most air, the least logo.',
    discs:[{x:.42,y:.56,r:.26},{x:.70,y:.34,r:.15}], sw:[G,P] },
];
const grid=document.getElementById('grid');
for(const v of VARIANTS){
  const cell=document.createElement('div'); cell.className='cell';
  cell.innerHTML=`<div class="plate"><canvas></canvas></div><div class="foot"><div><h3>${v.name}</h3></div><div class="tiny"><canvas></canvas></div></div><p>${v.why}</p>`;
  grid.appendChild(cell);
  const [big,tiny]=cell.querySelectorAll('canvas');
  mountSheets(big, v.discs.map(d=>({...d})), v.sw, { paper:'#FAF9F7', ground:'#1C1A17', bleed:0, clear:()=>0 });
  mountSheets(tiny, v.discs.map(d=>({...d})), v.sw, { paper:'#FAF9F7', ground:'#1C1A17', bleed:0, clear:()=>0 });
}
document.getElementById('dark').addEventListener('change',e=>document.documentElement.setAttribute('data-theme',e.target.checked?'dark':'light'));
</script>
</body></html>
