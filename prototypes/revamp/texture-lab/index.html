<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Texture lab — three ways to show the range</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --jak:"Plus Jakarta Sans",sans-serif; --hel:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --gold:#A99939; --oxblood:#340414; --charcoal:#1C1A17;
}
:root,[data-theme="light"]{
  --paper:#FAF9F7; --ink:#14171B;
  --ink2:rgba(20,23,27,.66); --ink3:rgba(20,23,27,.42); --hair:rgba(20,23,27,.16);
  --flick-a:#A99939; --flick-b:#340414;
  --pill:#fff; --pill-shadow:0 1px 2px rgba(20,23,27,.04),0 6px 20px rgba(20,23,27,.07);
  --outline:oklch(0 0 0 / 0.1);
  color-scheme:light;
}
[data-theme="dark"]{
  --paper:#1C1A17; --ink:#FAF9F7;
  --ink2:rgba(250,249,247,.66); --ink3:rgba(250,249,247,.42); --hair:rgba(250,249,247,.16);
  --flick-a:#A99939; --flick-b:#FAF9F7;
  --pill:#262320; --pill-shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --outline:oklch(1 0 0 / 0.1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font-family:var(--hel);font-weight:300;
     -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.wrap{max-width:1180px;margin:0 auto;padding:0 30px}

/* ---- the switcher. A lab bar, not the site's nav: this page is a question ---- */
nav{position:fixed;top:0;left:0;right:0;z-index:60;pointer-events:none}
nav .in{display:flex;justify-content:space-between;align-items:center;padding-top:24px}
nav .mark{pointer-events:auto;font-family:var(--jak);font-weight:600;font-size:13px;letter-spacing:-.01em;padding:10px 0;color:var(--ink)}
nav .links{pointer-events:auto;display:flex;align-items:center;gap:4px;background:var(--pill);
  border-radius:999px;padding:4px 6px 4px 6px;box-shadow:var(--pill-shadow)}
[data-theme="dark"] nav .links{outline:1px solid var(--outline);outline-offset:-1px}
nav button.pick{font-family:var(--hel);font-weight:400;font-size:14px;color:var(--ink2);
  background:transparent;border:0;padding:9px 15px;border-radius:999px;cursor:pointer;
  transition:color .18s ease,background .18s ease}
nav button.pick:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
nav button.pick[aria-pressed=true]{background:var(--ink);color:var(--paper)}
#theme{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--ink2);
  cursor:pointer;padding:0;display:grid;place-items:center;margin-left:2px}
#theme:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink)}
#theme svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
[data-theme="dark"] #theme .sun{display:none}
:root:not([data-theme="dark"]) #theme .moon{display:none}

/* ---- the hero, same chassis as the revamp ---- */
.hero{position:relative;overflow:hidden;padding:0 0 72px}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}
.hero-grid{display:grid;grid-template-columns:1fr;grid-template-rows:1.618fr auto 1fr;
  min-height:calc(100vh - 72px);position:relative;padding-top:96px;padding-bottom:120px;z-index:1}
.hero-grid,.hero .stack,.hero-foot{pointer-events:none}
.hero-foot a,.hint{pointer-events:auto}
.hero-grid .stack{grid-row:2;grid-column:1}
:root{--row:44px}
.stack{display:flex;flex-direction:column;gap:calc(var(--row) * .2)}
.line{display:flex;align-items:stretch}
.cell{flex:0 0 auto;height:var(--row);transition:background 140ms ease;
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);border-left:1px solid var(--hair);
  display:flex;align-items:center;overflow:hidden;will-change:width}
.cell:last-child{border-right:1px solid var(--hair)}
.ch{font-family:var(--hel);font-weight:400;font-size:calc(var(--row) * .9);line-height:1;
  color:var(--ink);position:relative;transition:color 140ms ease;padding-left:1.5px;white-space:pre}

/* the caption rail: what this arrangement is, and what the materials are. The
   lab has to say which is which or the comparison is not a comparison. */
.hero-foot{position:absolute;left:30px;right:30px;bottom:22px;display:grid;
  grid-template-columns:1fr auto;align-items:end;gap:20px;
  font:300 13px var(--hel);color:var(--ink3)}
.hero-foot .what{font-family:var(--jak);font-weight:500;font-size:15px;color:var(--ink);letter-spacing:-.01em;margin:0 0 4px}
.hero-foot .note{margin:0;color:var(--ink2);font-size:12.5px}
.key{display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-end;pointer-events:none}
.keys{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.wind{display:flex;align-items:center;gap:6px;pointer-events:auto;
  font:400 11px var(--hel);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.wind button{font:400 11px var(--hel);letter-spacing:.04em;color:var(--ink3);background:transparent;
  border:1px solid var(--hair);border-radius:999px;padding:3px 9px;cursor:pointer;
  transition:color .18s ease,border-color .18s ease,background .18s ease}
.wind button:hover{color:var(--ink)}
.wind button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.err{color:var(--touch,#340414);font-family:ui-monospace,monospace;font-size:11px;white-space:pre-wrap;max-width:60ch}
.key b{display:flex;align-items:center;gap:7px;font-weight:400;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink3)}
.key i{width:16px;height:16px;border-radius:4px;display:block;outline:1px solid var(--outline);outline-offset:-1px}
@media(max-width:780px){.hero-foot{grid-template-columns:1fr} .key{justify-content:flex-start}}
</style></head>
<body>

<nav><div class="wrap in">
  <span class="mark">Texture lab</span>
  <span class="links">
    <button class="pick" data-l="risoWall" aria-pressed="true">Riso</button>
    <button class="pick" data-l="postcards" aria-pressed="false">Riso card</button>
    <button class="pick" data-l="bands" aria-pressed="false">Bands</button>
    <button class="pick" data-l="rows" aria-pressed="false">Rows</button>
    <button class="pick" data-l="torn" aria-pressed="false">Torn</button>
    <button id="theme" aria-label="Toggle light and dark">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </span>
</div></nav>

<header class="hero">
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="wrap hero-grid">
    <div class="stack" id="stack"></div>
    <div class="hero-foot">
      <div>
        <p class="what" id="what"></p>
        <p class="note" id="note"></p>
        <p class="note err" id="err" hidden></p>
      </div>
      <div class="keys">
        <div class="wind" id="wind">
          <span>Wind</span>
          <button data-w="0.35">XS</button><button data-w="1" aria-pressed="true">M</button><button data-w="2.2">L</button>
        </div>
        <div class="key" id="key"></div>
      </div>
    </div>
  </div>
</header>

<script type="module">
import { tile, plate, KINDS } from "./materials.js";
import { LAYOUTS, ORDER } from "./layouts.js";

const dark = () => document.documentElement.getAttribute("data-theme") === "dark";

/* ---------- the wall, lifted from the revamp unchanged ---------- */
const WORDS = ["JAZLYNN","DESIGN","NEWYORK","PASSIONATE","CURIOUS","CHARM","PLAYFUL","MOTION","COGNITION","ENGINEERING"];
const SPEED = .23, DRIFT = .74;
let FS = 34, STRETCH = 84;
const gauge = document.createElement("canvas").getContext("2d");
const stack = document.getElementById("stack");

function measure(){
  const N = WORDS.length, free = innerHeight - 72 - 96 - 120;
  const rowPx = Math.max(38, Math.min(72, (free * .88) / (N + (N - 1) * .2)));
  document.documentElement.style.setProperty("--row", rowPx.toFixed(2) + "px");
  const probe = document.createElement("span");
  probe.className = "cell";
  probe.style.cssText = "position:absolute;visibility:hidden;width:1px";
  stack.appendChild(probe);
  const row = probe.getBoundingClientRect().height || 40;
  probe.remove();
  FS = row * .9; STRETCH = FS * 2.47;
  gauge.font = `400 ${FS}px "Helvetica Neue",Helvetica,Arial,sans-serif`;
}
measure();

const lines = WORDS.map((w, li) => {
  const el = document.createElement("div");
  el.className = "line";
  const cells = [...w].map((ch, ci) => {
    const c = document.createElement("span"); c.className = "cell";
    const s = document.createElement("span"); s.className = "ch"; s.textContent = ch;
    c.appendChild(s); el.appendChild(c);
    return { cell: c, glyph: s, ch, base: Math.ceil(gauge.measureText(ch).width) + 4, ci,
             next: 2 + Math.random() * 22, until: 0, lit: false, col: "" };
  });
  stack.appendChild(el);
  return { el, cells, seed: li };
});

const FLICK = ["var(--flick-a)", "var(--flick-b)"];
const LIT_MAX = 4;
let litNow = 0, t0 = 0;
lines.forEach(L => L.cells.forEach(c => { c.col = FLICK[(Math.random() * FLICK.length) | 0]; }));

function ink(c, on){
  if (c.lit === on) return;
  c.lit = on;
  c.cell.style.background = on ? c.col : "transparent";
  c.glyph.style.color = on ? "var(--paper)" : "";
}

/* ---------- the ground ---------- */
const cv = document.getElementById("bg");
let W = 0, H = 0, dpr = 1, c2 = null, raf = 0;
let current = "risoWall";

function size(){
  const r = cv.getBoundingClientRect();
  if (!r.width) return false;
  dpr = Math.min(2, devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = W * dpr; cv.height = H * dpr;
  c2 = cv.getContext("2d");
  c2.setTransform(dpr, 0, 0, dpr, 0, 0);
  return true;
}

/* Layout B needs to know where the word rows actually are, which only the DOM
   knows. Read once per paint rather than per row, and in the canvas's own
   coordinates so a resize does not desync the bands from the type. */
function readRows(){
  const hb = cv.getBoundingClientRect();
  LAYOUTS.rows.bands = lines.map(L => {
    const r = L.el.getBoundingClientRect();
    return { y: r.top - hb.top, h: r.height, w: r.width };
  });
}

/* the plate's height is the wall's height, and only the DOM knows that. Read
   once per paint, in the canvas's own coordinates, so a resize can never leave
   the two out of step. */
/* HOW FAR RIGHT THE WALL CAN EVER REACH.
 *
 * Every cell's width oscillates, so the ragged right edge is not a position, it
 * is a range. Clearing where it happens to sit at this instant only moves the
 * collision to a different moment of the cycle. The cells do not peak together
 * either, because each carries its own phase, so the theoretical maximum (every
 * cell at full stretch at once) never happens and would reserve far too much
 * room if we used it.
 *
 * So the cycle is simply sampled. The whole wall repeats every 1/SPEED seconds,
 * so walking one period and keeping the widest row actually observed gives the
 * true bound. Cheap, exact, and it only has to run when the type is remeasured.
 */
function wallReach(){
  const period = 1 / SPEED;
  let widest = 0;
  for (let n = 0; n < 160; n++) {
    const t = (n / 160) * period;
    for (const L of lines) {
      let x = 0;
      for (const c of L.cells) {
        const k = .5 + .5 * Math.sin(t * SPEED * Math.PI * 2 + L.seed * DRIFT + c.ci * DRIFT * 1.7);
        x += c.base + k * k * STRETCH;
      }
      if (x > widest) widest = x;
    }
  }
  return widest;
}

function readWall(){
  const hb = cv.getBoundingClientRect();
  const first = lines[0].el.getBoundingClientRect();
  const last = lines[lines.length - 1].el.getBoundingClientRect();
  /* .wrap carries a 30px gutter, so the content edge is inside its box */
  const wrap = document.querySelector(".hero-grid").getBoundingClientRect();
  const stackBox = stack.getBoundingClientRect();
  LAYOUTS.risoWall.span = {
    top: first.top - hb.top,
    bottom: last.bottom - hb.top,
    right: wrap.right - hb.left - 30,
    /* the furthest right any row will ever reach, plus a gutter, so the plate
       is placed against the wall's RANGE rather than its current position */
    clear: (stackBox.left - hb.left) + wallReach() + 28,
  };
}

function paint(){
  raf = 0;
  if (!c2) return;
  const d = dark();
  c2.clearRect(0, 0, W, H);
  if (current === "rows") readRows();
  if (current === "risoWall") readWall();
  if (LAYOUTS[current].live) {
    const err = document.getElementById("err"), L = LAYOUTS[current];
    if (!!L.error !== !err.hidden) { err.textContent = L.error ? "shader fell back to the still print: " + L.error : ""; err.hidden = !L.error; }
  }
  LAYOUTS[current].draw(c2, W, H, d);
}
const repaint = () => { if (!raf) raf = requestAnimationFrame(paint); };

/* ---------- the caption and the key ---------- */
const NAMES = Object.fromEntries(KINDS.map(k => [k.key, k.name]));
/* the riso card is a plate, not one of the five tiles, so it needs its own
   label and its own swatch source */
NAMES.riso = "riso on postcard stock";
function caption(){
  const L = LAYOUTS[current];
  document.getElementById("what").textContent = L.name;
  document.getElementById("note").textContent = L.note;
  /* a shader that failed says so here, in the caption, rather than leaving a
     still print with no explanation */
  const err = document.getElementById("err");
  err.textContent = L.error ? "shader fell back to the still print: " + L.error : "";
  err.hidden = !L.error;
  const key = document.getElementById("key");
  key.innerHTML = "";
  (L.uses || ORDER).forEach(k => {
    const b = document.createElement("b");
    const i = document.createElement("i");
    /* the swatch in the key is a crop of the real tile, never an approximation
       of it: a key that lies about the material is worse than no key */
    /* the swatch is a crop of the real thing, never an approximation: a key
       that lies about the material is worse than no key */
    const src = k === "riso" ? plate("riso", 132, 94, dark()) : tile(k, dark());
    i.style.background = `url(${src.toDataURL()}) center / cover`;
    if (k !== "riso") i.style.backgroundSize = "44px";
    b.appendChild(i);
    b.appendChild(document.createTextNode(NAMES[k]));
    key.appendChild(b);
  });
}

/* ---------- interaction ---------- */
let held = -1, grabX = 0, grabY = 0;
const at = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

cv.addEventListener("pointerdown", e => {
  const p = at(e);
  if (current === "bands") {
    held = LAYOUTS.bands.pick(p.x, W);
    if (held >= 0) cv.setPointerCapture(e.pointerId);
  } else if (current === "postcards") {
    const i = LAYOUTS.postcards.pick(p.x, p.y, W, H);
    if (i < 0) return;
    const card = LAYOUTS.postcards.cards[i];
    grabX = p.x - card.x * W; grabY = p.y - card.y * H;
    LAYOUTS.postcards.cards.splice(i, 1);
    LAYOUTS.postcards.cards.push(card);
    held = LAYOUTS.postcards.cards.length - 1;
    cv.setPointerCapture(e.pointerId);
    repaint();
  } else if (current === "torn") {
    const i = LAYOUTS.torn.pick(p.x, p.y, W, H);
    if (i < 0) return;
    const s = LAYOUTS.torn.sheets[i];
    grabX = p.x - s.x * W; grabY = p.y - s.y * H;
    /* the one the hand is on comes to the top of the stack, as paper would */
    LAYOUTS.torn.sheets.splice(i, 1);
    LAYOUTS.torn.sheets.push(s);
    held = LAYOUTS.torn.sheets.length - 1;
    cv.setPointerCapture(e.pointerId);
    repaint();
  }
});

cv.addEventListener("pointermove", e => {
  const p = at(e);
  if (held < 0) {
    let over = false;
    if (current === "bands") over = LAYOUTS.bands.pick(p.x, W) >= 0;
    else if (current === "torn") over = LAYOUTS.torn.pick(p.x, p.y, W, H) >= 0;
    else if (current === "postcards") {
      const i = LAYOUTS.postcards.pick(p.x, p.y, W, H);
      over = i >= 0;
      /* the lift is driven by which card is under the hand, and eased in the
         frame loop, so it arrives rather than snapping */
      if (LAYOUTS.postcards.hot !== i) { LAYOUTS.postcards.hot = i; lifting = true; }
    }
    cv.style.cursor = over ? (current === "bands" ? "ew-resize" : "grab") : "default";
    return;
  }
  if (current === "bands") LAYOUTS.bands.move(held, p.x, W);
  else if (current === "postcards") {
    const card = LAYOUTS.postcards.cards[held];
    card.x = (p.x - grabX) / W; card.y = (p.y - grabY) / H;
  }
  else {
    const s = LAYOUTS.torn.sheets[held];
    s.x = (p.x - grabX) / W; s.y = (p.y - grabY) / H;
  }
  repaint();
});
const drop = () => { held = -1; };
cv.addEventListener("pointerleave", () => {
  if (LAYOUTS.postcards.hot !== -1) { LAYOUTS.postcards.hot = -1; lifting = true; }
});
let lifting = false;
addEventListener("pointerup", drop);
addEventListener("pointercancel", drop);

/* clicking a row in layout B rotates which stock each line is printed on, so
   the pairing can be judged rather than accepted */
document.getElementById("stack").addEventListener("click", () => {
  if (current !== "rows") return;
  LAYOUTS.rows.offset = (LAYOUTS.rows.offset + 1) % ORDER.length;
  repaint();
}, true);
document.querySelector(".hero-grid").style.pointerEvents = "none";
stack.style.pointerEvents = "auto";

/* ---------- the switcher and the mode ---------- */
document.querySelectorAll(".pick").forEach(b => {
  b.addEventListener("click", () => {
    current = b.dataset.l;
    document.querySelectorAll(".pick").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
    caption();
    repaint();
  });
});

document.getElementById("wind").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-w]");
  if (!b) return;
  LAYOUTS.risoWall.wind = parseFloat(b.dataset.w);
  document.querySelectorAll("#wind button").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
});

document.getElementById("theme").addEventListener("click", () => {
  const next = dark() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("texlab-theme", next); } catch {}
  caption();
  repaint();
});
try {
  const saved = localStorage.getItem("texlab-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
} catch {}

/* ---------- the wall's own loop ---------- */
(function tick(now){
  const t = (now || 0) / 1000;
  if (!t0) t0 = t;
  const age = t - t0;
  const arriving = age < 2.6;
  const front = age * 46;

  for (const L of lines) {
    let x = 0;
    const cy = L.seed * (FS / .9 * 1.2) + FS / .9 / 2;
    for (const c of L.cells) {
      const k = .5 + .5 * Math.sin(t * SPEED * Math.PI * 2 + L.seed * DRIFT + c.ci * DRIFT * 1.7);
      const w = c.base + k * k * STRETCH;
      c.cell.style.width = w.toFixed(1) + "px";
      if (arriving) {
        const d = x + w / 2 + cy * 0.6;
        ink(c, d < front && d > front - 130);
        x += w; continue;
      }
      if (c.lit && t > c.until) { ink(c, false); litNow--; c.next = t + 6 + Math.random() * 26; }
      else if (!c.lit && t > c.next) {
        if (litNow >= LIT_MAX) c.next = t + 1 + Math.random() * 4;
        else { ink(c, true); litNow++; c.until = t + 0.25 + Math.random() * 0.9; }
      }
      x += w;
    }
  }
  /* layout B's bands are bound to rows whose widths are breathing, so the
     ground has to follow the type. The other two are still until a hand moves
     them, which is what keeps this page from holding a frame loop open. */
  if (current === "rows" || LAYOUTS[current].live) repaint();
  /* the cards ease toward lifted or flat and then stop. Nothing animates once
     they have arrived, which is what keeps a page that is mostly read from
     holding a frame loop open forever. */
  if (current === "postcards" && (lifting || held >= 0)) {
    const P = LAYOUTS.postcards;
    let moving = false;
    P.cards.forEach((card, i) => {
      const want = (i === P.hot || i === held) ? 1 : 0;
      const d = want - card.lift;
      if (Math.abs(d) > 0.004) { card.lift += d * 0.18; moving = true; }
      else card.lift = want;
    });
    if (moving) repaint(); else lifting = false;
  }
  requestAnimationFrame(tick);
})();

let rz = 0;
addEventListener("resize", () => {
  clearTimeout(rz);
  rz = setTimeout(() => {
    measure();
    lines.forEach(L => L.cells.forEach(c => { c.base = Math.ceil(gauge.measureText(c.ch).width) + 4; }));
    if (size()) repaint();
  }, 120);
});

size();
caption();
repaint();
</script>
</body></html>
