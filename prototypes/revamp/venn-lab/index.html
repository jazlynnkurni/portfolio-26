<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Venn lab</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAF9F7;--ink:#14171B;--ink2:rgba(20,23,27,.66);--ink3:rgba(20,23,27,.42);--hair:rgba(20,23,27,.16);--jak:"Plus Jakarta Sans",sans-serif;--hel:"Helvetica Neue",Helvetica,Arial,sans-serif}
html[data-theme="dark"]{--paper:#1C1A17;--ink:#FAF9F7;--ink2:rgba(250,249,247,.66);--ink3:rgba(250,249,247,.42);--hair:rgba(250,249,247,.16)}
html,body{margin:0;background:var(--paper);color:var(--ink);font:300 14px/1.5 var(--hel);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:56px 30px 80px;display:grid;grid-template-columns:1fr 300px;gap:48px;align-items:start}
.label{font:600 10.5px/1.5 var(--jak);letter-spacing:.15em;text-transform:uppercase;color:var(--ink3)}
h1{font:500 clamp(28px,4vw,44px)/1.12 var(--jak);letter-spacing:-.012em;margin:12px 0 0;max-width:22ch}
p.lede{font-size:17px;line-height:1.62;color:var(--ink2);margin:16px 0 0;max-width:52ch}
.stage{margin-top:40px;position:relative;aspect-ratio:4/3;max-width:820px}
#sheets{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{position:sticky;top:56px;border:1px solid var(--hair);padding:20px;display:grid;gap:14px}
.row{display:grid;grid-template-columns:1fr 60px;gap:10px;align-items:center;font:500 12.5px var(--jak)}
.row span{color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ink);margin:6px 0 0}
label.chk{display:flex;gap:10px;align-items:center;font:500 12.5px var(--jak)}
.sw{display:flex;gap:10px;align-items:center;font:500 12.5px var(--jak)}.sw input{width:34px;height:26px;border:0;padding:0;background:none}
button{font:500 12.5px var(--jak);color:var(--ink);background:transparent;border:1px solid var(--hair);border-radius:999px;padding:8px 14px;cursor:pointer}
pre{font:11.5px/1.5 ui-monospace,Menlo,monospace;color:var(--ink2);background:color-mix(in srgb,var(--ink) 4%,transparent);padding:12px;border-radius:8px;margin:0;white-space:pre-wrap}
</style></head><body>
<div class="wrap">
  <div>
    <div class="label">Riso · two discs</div>
    <h1>Green and purple, meeting in the middle.</h1>
    <p class="lede">The same frosted sheets as the hero, two of them, laid over each other like a Venn diagram. Where they overlap the tints multiply the way two riso passes do on paper. Drag either disc; they spring back to their places.</p>
    <div class="stage"><canvas id="sheets" aria-hidden="true"></canvas></div>
  </div>
  <aside class="panel">
    <div class="label">Tune</div>
    <div class="row"><label>Radius <input id="r" type="range" min=".12" max=".34" step=".005" value=".23"></label><span></span></div>
    <div class="row"><label>Overlap <input id="ov" type="range" min="0" max="1" step=".02" value=".5"></label><span></span></div>
    <div class="row"><label>Height <input id="y" type="range" min=".3" max=".7" step=".01" value=".5"></label><span></span></div>
    <div class="sw"><input id="c1" type="color" value="#9ba69c"> green</div>
    <div class="sw"><input id="c2" type="color" value="#827a85"> purple</div>
    <label class="chk"><input id="dark" type="checkbox"> dark mode</label>
    <button id="copy">copy settings</button>
    <pre id="out"></pre>
  </aside>
</div>
<script type="module">
import { mountSheets } from '/sheets-gl.js';
/* TWO SHEETS. The hero's shader draws any list of discs; here it is two, side by side on the
   stage's own axis, overlapping by a share of their radius. Every disc takes its tint from the
   swatch by index, so the swatch is exactly [green, purple]. The stage's aspect is the unit:
   x runs across, y down, radius in the same unit as the hero. */
let cv=document.getElementById('sheets'); const stage=cv.parentElement;
const P={r:.23,ov:.5,y:.5,c1:'#9ba69c',c2:'#827a85'};
let handle=null;
const place=()=>{ const half=P.r*(1-P.ov); return [{x:.5-half,y:P.y,r:P.r},{x:.5+half,y:P.y,r:P.r}]; };
/* mounted once; the sliders move the discs in place, a colour change remounts on a fresh canvas
   (the tints are baked at mount) */
function build(){
  const fresh=cv.cloneNode(false); cv.replaceWith(fresh); cv=fresh;
  handle=mountSheets(cv, place(), [P.c1,P.c2], { paper:'#FAF9F7', ground:'#1C1A17', bleed:0, clear:()=>0 });
}
function update(){ const s=place(); handle.discs.forEach((d,i)=>{ d.ux=d.ux0=s[i].x; d.uy=s[i].y; d.ur=s[i].r; }); handle.draw(); }
build();
const out=document.getElementById('out'); const show=()=>out.textContent=JSON.stringify(P);
for(const k of ['r','ov','y']){ const el=document.getElementById(k); const span=el.closest('.row').querySelector('span');
  const upd=()=>{ P[k]=+el.value; span.textContent=(+el.value).toFixed(2); show(); }; el.addEventListener('input',()=>{ upd(); update(); }); upd(); }
for(const k of ['c1','c2']){ const el=document.getElementById(k); el.addEventListener('input',()=>{ P[k]=el.value; show(); build(); }); }
document.getElementById('dark').addEventListener('change',e=>document.documentElement.setAttribute('data-theme',e.target.checked?'dark':'light'));
document.getElementById('copy').addEventListener('click',()=>navigator.clipboard.writeText(out.textContent));
show();
</script>
</body></html>
