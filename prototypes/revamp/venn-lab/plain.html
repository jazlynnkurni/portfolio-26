<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#FAF9F7;height:100%}.stage{position:absolute;inset:0}#sheets{position:absolute;inset:0;width:100%;height:100%;display:block}</style></head>
<body><div class="stage"><canvas id="sheets"></canvas></div>
<script type="module">
import { mountSheets } from '/sheets-gl.js';
const r=.20, ov=.5, half=r*(1-ov);
mountSheets(document.getElementById('sheets'), [{x:.5-half,y:.5,r},{x:.5+half,y:.5,r}], ['#9ba69c','#827a85'], { paper:'#FAF9F7', ground:'#1C1A17', bleed:0, clear:()=>0 });
</script></body></html>
