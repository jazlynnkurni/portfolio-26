<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scatter vs Pour</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#2a2826;color:#FAF9F7;font:500 13px "Plus Jakarta Sans",sans-serif;-webkit-font-smoothing:antialiased}
.top{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;justify-content:center;align-items:center;padding:14px;z-index:2}
button{font:inherit;color:#FAF9F7;background:transparent;border:1px solid rgba(250,249,247,.22);border-radius:999px;padding:8px 14px;cursor:pointer}
button[aria-pressed=true]{background:#FAF9F7;color:#1C1A17;border-color:#FAF9F7}
.stage{min-height:100%;display:flex;gap:64px;justify-content:center;align-items:flex-start;padding:72px 24px 40px;box-sizing:border-box;flex-wrap:wrap}
.one{display:grid;gap:14px;justify-items:center}
.one h2{margin:0;font:500 15px "Plus Jakarta Sans",sans-serif;letter-spacing:.01em}
.one h2 span{color:rgba(250,249,247,.5);margin-left:8px;font-weight:500}
.phone{position:relative;width:393px;height:852px;transform:scale(0.78);transform-origin:top center;margin-bottom:-187px;border-radius:55px;background:#000;box-shadow:0 0 0 11px #1a1a1a,0 0 0 13px #3b3b3b,0 40px 80px -20px rgba(0,0,0,.8)}
.phone iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:55px;background:#FAF9F7}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:999px;background:#000;z-index:3}
.btn{position:absolute;background:#2b2b2b;border-radius:2px}
.btn.l1{left:-16px;top:150px;width:3px;height:30px}.btn.l2{left:-16px;top:210px;width:3px;height:62px}.btn.l3{left:-16px;top:290px;width:3px;height:62px}.btn.r{right:-16px;top:240px;width:3px;height:96px}
</style></head><body>
<div class="top"><button id="replay">↻ replay both</button><button data-t="light" aria-pressed="true">Light</button><button data-t="dark">Dark</button></div>
<div class="stage">
  <div class="one"><h2>Scatter <span>the twelve sheets blown off the edges</span></h2><div class="phone"><div class="island"></div><div class="btn l1"></div><div class="btn l2"></div><div class="btn l3"></div><div class="btn r"></div><iframe data-i="scatter" title="Scatter"></iframe></div></div>
  <div class="one"><h2>Pour <span>six sheets dropped, piled, sunk away</span></h2><div class="phone"><div class="island"></div><div class="btn l1"></div><div class="btn l2"></div><div class="btn l3"></div><div class="btn r"></div><iframe data-i="pour" title="Pour"></iframe></div></div>
</div>
<script>
let t='light';
function go(){ for(const f of document.querySelectorAll('iframe')) f.src='/?theme='+t+'&intro='+f.dataset.i+'&r='+Date.now(); }
document.getElementById('replay').addEventListener('click',go);
for(const b of document.querySelectorAll('[data-t]')) b.addEventListener('click',()=>{ t=b.dataset.t; for(const x of document.querySelectorAll('[data-t]')) x.setAttribute('aria-pressed',x===b); go(); });
go();
</script>
</body></html>
