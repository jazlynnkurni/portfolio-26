<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache">
<title>Jazlynn Kurniandra</title>
<link rel="icon" href="/favicon.png" type="image/png"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta property="og:image" content="https://jazlynnwashere.com/og.png"><meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<script src="/site-mark.js?v=sig11"></script>
<style>
:root{
  --jak:"Plus Jakarta Sans",sans-serif; --hel:"Helvetica Neue",Helvetica,Arial,sans-serif;
  /* the three, fixed in both modes */
  --gold:#A99939; --oxblood:#340414; --charcoal:#1C1A17;
}
/* ============ TWO MODES, ONE PALETTE ==============================================
 * No colour is introduced for dark mode. The ground and the ink swap places -- paper
 * becomes the ink, charcoal becomes the ground -- and everything else is a tint of
 * whichever is the ink. The one thing that cannot simply swap is the INTERACTION
 * colour: oxblood is 12.1:1 on paper and 1.0:1 on charcoal, literally invisible, while
 * gold is 1.6:1 on paper and 6.0:1 on charcoal. So each mode uses the one of the two
 * that can be read on its ground. That is the whole dark-mode design, and it is why
 * the lock ("the background is always paper") can survive this as a rule about the
 * DEFAULT rather than about every state. */
:root, [data-theme="light"]{
  --paper:#FAF9F7; --ink:#14171B; --sig:#9ba69c;
  --ink2:rgba(20,23,27,.66); --ink3:rgba(20,23,27,.42); --hair:rgba(20,23,27,.16);
  --touch:#340414;
  --flick-a:#A99939; --flick-b:#340414;
  /* the surface media sits on. On paper it IS the paper; the outline is what draws
     the box. */
  --plate:#FAF9F7; --outline:oklch(0 0 0 / 0.1);
  /* the nav pill: paper lifted toward white, no new hue */
  --pill:#fff; --pill-shadow:0 1px 2px rgba(20,23,27,.04),0 6px 20px rgba(20,23,27,.07);
  color-scheme:light;
}
[data-theme="dark"]{
  --paper:#1C1A17; --ink:#FAF9F7; --sig:#9ba69c;
  --ink2:rgba(250,249,247,.66); --ink3:rgba(250,249,247,.42); --hair:rgba(250,249,247,.16);
  --touch:#A99939;
  /* oxblood is invisible here, so the second tile colour is the ink itself: a paper
     tile with a charcoal letter, which is the same "knocked out" logic inverted */
  --flick-a:#A99939; --flick-b:#FAF9F7;
  /* lifted four points off the ground so a plate reads as a plate. Without this the
     media boxes and the Track Record panel were charcoal on charcoal: present in
     the DOM, invisible on the screen. */
  --plate:#262320; --outline:oklch(1 0 0 / 0.1);
  --pill:#262320; --pill-shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
html{background:var(--paper)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--hel);font-weight:300;
     -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,.jak{font-family:var(--jak);font-weight:500;letter-spacing:-.012em;text-wrap:balance}
p{text-wrap:pretty}
.wrap{max-width:1180px;margin:0 auto;padding:0 30px}
.label{font-family:var(--jak);font-weight:600;font-size:10.5px;line-height:1.5;letter-spacing:.15em;
       text-transform:uppercase;color:var(--ink3)}
.grain{position:absolute;inset:0;pointer-events:none;background-image:var(--noise);
       background-size:170px 170px;mix-blend-mode:overlay;opacity:.55}

/* ---------------- nav ---------------- */
/* ============ THE LOADING BLOB ===================================================
 * NO EXACT VALUES. The outline is a ring of control points whose radius is the sum of
 * several sines at unrelated frequencies, all drifting at different rates, so the
 * shape never repeats and never settles into a circle. A single sine would breathe;
 * three incommensurable ones wander.
 * The points are joined with Catmull-Rom converted to cubic beziers rather than
 * straight lines, so the edge is continuously curved -- a polygon with enough points
 * still reads as faceted at the silhouette, which is exactly where the eye looks. */
#load{position:fixed;inset:0;z-index:200;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  transition:opacity 520ms ease}
#load.gone{opacity:0;pointer-events:none}
/* ============ THE LOADER IS THE GRID =============================================
 * Same object as the hero: cells with a head rule, a foot rule and a stem at each start.
 * Order of events, because a loader that all happens at once is not a loader:
 *   0ms    the head rule draws left to right, the foot rule 120ms behind it
 *   380ms  stems drop in from the head, one every 70ms, cutting the line into cells
 *   0ms    widths breathe on the hero's sine, so the rules stretch while they draw
 *   1000ms the cells ink one after another and STAY, left to right -- a progress bar
 *          that is also the masthead arriving. Straight lines, rectangles, one sweep.
 * The bar finishes about 1.8s in; the page leaves at 2s or when load is done, whichever
 * is later, so the sweep is never cut off half-inked. */
#load .ld{position:relative;display:flex;height:40px;width:min(300px,70vw)}
#load .ld i{position:absolute;left:0;right:0;height:1px;background:var(--hair);transform:scaleX(0);
  transform-origin:left center;animation:ld-rule 560ms cubic-bezier(.22,1,.36,1) forwards}
#load .ld i.head{top:0}
#load .ld i.foot{bottom:0;animation-delay:120ms}
#load .lc{flex:0 0 auto;height:40px;position:relative;transition:background 160ms ease;will-change:width}
#load .lc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--hair);
  transform:scaleY(0);transform-origin:top center;animation:ld-stem 420ms cubic-bezier(.22,1,.36,1) forwards;
  animation-delay:var(--d)}
#load .lc:last-child::after{content:"";position:absolute;right:0;top:0;bottom:0;width:1px;background:var(--hair);
  transform:scaleY(0);transform-origin:top center;animation:ld-stem 420ms cubic-bezier(.22,1,.36,1) forwards;
  animation-delay:calc(var(--d) + 70ms)}
/* the fills are the two: oxblood and gold, same tokens as the hero's tiles, so in dark
   mode the oxblood (invisible on charcoal) swaps to paper exactly as it does there */
#load .lc.on{background:var(--flick-b)}
#load .lc.on.g{background:var(--flick-a)}
@keyframes ld-rule{to{transform:scaleX(1)}}
@keyframes ld-stem{to{transform:scaleY(1)}}
@media(prefers-reduced-motion:reduce){#load .ld i,#load .lc::before,#load .lc:last-child::after{animation:none;transform:none}}
#load span{font:300 12.5px var(--hel);letter-spacing:.08em;color:var(--ink3)}
/* his nav, read off the screenshot: nothing spans the page. The name sits alone top-left
   and the links float top-right in a lifted pill with the mode icon at its head. The
   pill is a shadow, not a border: the outline is the 10% image rule, not a frame. */
nav{position:fixed;top:0;left:0;right:0;z-index:60;pointer-events:none}
nav .in{display:flex;justify-content:space-between;align-items:center;padding-top:24px;position:relative}
/* THE NAV HAS A GROUND. It is fixed, and headlines scroll up under it, so the mark and the pill sit
   on a band of paper that fades out below them; the content dims into it instead of crashing. */
nav::before{content:"";position:absolute;left:0;right:0;top:0;height:104px;pointer-events:none;
  background:linear-gradient(var(--paper) 46%,color-mix(in srgb,var(--paper) 70%,transparent) 72%,transparent);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);-webkit-mask:linear-gradient(#000 50%,transparent);mask:linear-gradient(#000 50%,transparent);
  opacity:0;transition:opacity .3s ease}
nav.grounded::before{opacity:1}

nav .mark{pointer-events:auto;font-family:var(--jak);font-weight:600;font-size:13px;letter-spacing:-.01em;padding:10px 0}

/* measured off his pill: 46px tall, the icon 24px in from the left edge, ~44px between
   words, the last word 28px from the right edge. Pure white on the paper, no outline. */
nav .links{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--pill);border-radius:999px;
  padding:4px 12px 4px 8px;box-shadow:var(--pill-shadow)}
[data-theme="dark"] nav .links{outline:1px solid var(--outline);outline-offset:-1px}
/* nav words are body copy, not headings: Helvetica Neue like everything that is read,
   at Regular rather than Light so 14px holds up on the white pill */
nav a{font-family:var(--hel);font-weight:400;font-size:14.5px;letter-spacing:0;color:var(--ink);text-decoration:none;
      padding:10px 16px;border-radius:999px;transition:color .18s ease,background .18s ease}
nav a:hover{color:var(--touch);background:color-mix(in srgb,var(--ink) 6%,transparent)}
nav a:active{transform:scale(.96)}
/* the mode icon: a sun in light, a moon in dark, 36px so it clears the hit-area floor */
/* THE TIN TOGGLE. It sat in a free corner first and read as bolted on, because a made
   object needs something to sit beside. It belongs on the rail with the clock: big enough
   that the strike marks and the engraving are legible, and anchored to a line of the page
   instead of to the viewport. It is the heaviest thing on an otherwise light rail, which
   is what gives that line a left end. */
.hero-foot .when{display:flex;align-items:center;gap:14px;pointer-events:auto}
.tin{width:clamp(96px,9vw,124px);aspect-ratio:2.1;display:block;border:0;padding:0;
  background:transparent;cursor:pointer;outline:none;flex:0 0 auto;
  filter:drop-shadow(0 4px 12px rgba(20,23,27,.14))}
[data-theme="dark"] .tin{filter:drop-shadow(0 5px 16px rgba(0,0,0,.45))}
.tin:focus-visible{outline:2px solid var(--ink);outline-offset:5px;border-radius:999px}
@media(max-width:640px){.tin{width:86px}}
#theme{width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--ink2);
  cursor:pointer;padding:0;display:grid;place-items:center;transition:background .18s ease,color .18s ease}
#theme:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink)}
#theme:active{transform:scale(.96)}
#theme svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
[data-theme="dark"] #theme .sun{display:none}
:root:not([data-theme="dark"]) #theme .moon{display:none}
@media(max-width:640px){nav .in{padding-top:16px} nav a{padding:9px 10px;font-size:12.5px}}
@media(max-width:480px){nav .in{flex-direction:column;align-items:flex-start;gap:10px} nav a{padding:8px 9px;font-size:12px}}

/* ---------------- hero: the locked letter grid ---------------- */
.hero{padding:0}
.hero-grid{display:grid;grid-template-columns:1fr;grid-template-rows:1.618fr auto 1fr;min-height:calc(100vh - 72px);position:relative;padding-top:96px;padding-bottom:120px}
/* ============ THE SHEETS =========================================================
 * Her vellum piece, off its black plate and laid across the page.
 *
 * Taking the box away changes the arithmetic, and the palette lock already said it would:
 * the sheets are translucent, and translucent only reads against a ground. On the paper
 * they are PIGMENT and multiply, so two crossing sheets go deeper. On the charcoal they
 * are LIGHT and add, which is what they do in the lab. Same discs, opposite sign, and it
 * is the only way they can sit under the type on both grounds.
 *
 * They sit UNDER the wall on purpose: the name has to stay readable, so the sheets never
 * cover a letter, they tint the paper the letter is printed on. */
/* ============ THE SCROLL ==========================================================
 * The hero does not scroll away, it is scrolled OVER. It sits sticky at the top and
 * the projects rise up across it, with a gradient cap on their leading edge so the
 * wall and the sheets are engulfed rather than cut. As they go under, the two are
 * faded out by scroll position and the wall drifts up a little, so the page reads as
 * one motion rather than a stack of blocks. */
.hero{position:sticky;top:0;overflow:visible;z-index:0}
.hero .stack,#sheets{will-change:opacity,transform}
body>.pushing{transition:transform .5s cubic-bezier(.22,1,.36,1)}
.work{position:relative;z-index:2;background:var(--paper)}
/* the cap is short and eased: a long linear ramp read as a white block sliding up the
   hero. Half the height, and most of the fade happens in its lower third. */
.work::before{content:"";position:absolute;left:0;right:0;top:-110px;height:110px;pointer-events:none;
  background:linear-gradient(to bottom,transparent 0%,color-mix(in srgb,var(--paper) 35%,transparent) 45%,color-mix(in srgb,var(--paper) 80%,transparent) 78%,var(--paper) 100%)}
/* THE SHEETS ARE THE VELLUM PIECE ITSELF NOW, on the GPU: see sheets-gl.js. The
   canvas is opaque and paints the page colour under the sheets, so there is no
   blend mode: the ground IS the page, and the hero edge is seamless. */
/* the canvas hangs 220px above the hero, so when the page is pushed down the discs keep
   going up under the nav instead of ending at a line. The hero no longer clips: the
   canvas is its own rectangle and clips itself on the right and the foot. */
:root{--bleed:220px}
#sheets{position:absolute;left:0;right:0;top:calc(-1 * var(--bleed));height:calc(100% + var(--bleed));width:100%;display:block;z-index:0;touch-action:none}
.hero-grid{z-index:1}
/* the type is a window onto the sheets, not a lid. The GRID has to be transparent too,
   not just its children -- it is a full-bleed box sitting over the canvas, and it was
   swallowing every drag. Only the things you can actually click take events back. */
.hero-grid,.hero .stack,.hero-foot{pointer-events:none}
.hero-foot a,.hint{pointer-events:auto}
/* THE GOLDEN SECTION, weighted to the foot. The free space is split 1.618 : 1, air above to
   air below: the larger share clears the fixed pill, and the block settles low in the hero
   the way his masthead does, with the hint just beneath it. */
.hero-grid .stack{grid-row:2;grid-column:1}
/* top/bottom only: the shorthand was wiping .wrap's 30px gutter, which put the grid 30px left of the name */
/* ONE composition on every screen: the row scales with the viewport so the ten rows take
   about two thirds of the hero, the rest split at the golden section. A fixed 40px row left
   whatever was left over above the block, and leftover space reads as empty. */
:root{--row:clamp(34px,5.4vh,56px)}
section[id]{scroll-margin-top:24px}
/* his composition, read off the page: the toy owns the upper-left, the masthead sits
   LOWER-RIGHT, and a "view project" hint sits at the foot. The facts align to the
   bottom of the grid rather than the top, which is what puts them there. */
.facts .who{font-family:var(--jak);font-weight:600;font-size:15px;color:var(--ink);letter-spacing:-.01em}
.facts b{font-weight:400;color:var(--ink)}
.hint{font:400 14.5px var(--hel);color:var(--ink);text-decoration:none;
  display:inline-flex;align-items:center;gap:10px;padding:4px 8px;transition:color .18s ease}
.hint svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* three columns, not space-between: the outer two are equal so the middle item sits on the
   page's centre line rather than halfway between two labels of different lengths */
/* THE RAIL IS ONE PLACE. It is pinned to the viewport on the page's own column (the
   1180 measure, 30px gutters), and the footer's row is built on the same grid at the
   same height, 22px off the bottom, so when the page runs out the footer's links land
   exactly where the hint was and the clock and the copyright never move. */
.hero-foot{position:fixed;left:0;right:0;bottom:22px;z-index:6;display:grid;
  max-width:1180px;margin:0 auto;padding:0 30px;height:26px}
footer .in a{font-size:13px}
.hint{will-change:opacity}
.hero-foot{
  grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;
  font:400 13px var(--hel);color:var(--ink2);white-space:nowrap}
.hero-foot .cr{text-align:right}
/* the rail is read, not glanced at: the values in full ink, the label a step back */
.hero-foot b{font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.hero-foot .cr{color:var(--ink)}
@media(max-width:640px){.hero-foot{font-size:12px}}
.hint:hover{color:var(--touch)}
/* the negative space only exists on a wide screen. Below this the grid fills the width
   and the facts reflow underneath, left-aligned, as a second beat rather than a column. */
@media(max-width:900px){
  .hero-grid{grid-template-columns:1fr;row-gap:36px}
}
.stack{display:flex;flex-direction:column;gap:calc(var(--row) * .2)}
/* what she does, in one line, above the fold: the wall says who, this says what */
.stack .who{font:400 15px/1.5 var(--hel);color:var(--ink2);margin:0 0 10px;max-width:52ch}
.line{display:flex;align-items:stretch}
/* head + foot rules live on the CELL, so touching cells give one unbroken rule
   across the row. That continuity is what holds a word together while the
   spacing moves. Left border only: a right border doubles every seam. */
.cell{flex:0 0 auto;height:var(--row);transition:background 140ms ease;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
      border-left:1px solid var(--hair);display:flex;align-items:center;overflow:hidden;will-change:width}
.cell:last-child{border-right:1px solid var(--hair)}
.ch{font-family:var(--hel);font-weight:400;font-size:calc(var(--row) * .9);line-height:1;color:var(--ink);position:relative;transition:color 140ms ease;
    padding-left:1.5px;white-space:pre}

/* ---------------- track record plate ---------------- */
.plate{position:relative;background:var(--plate);outline:1px solid var(--outline);outline-offset:-1px;border-radius:20px;overflow:hidden;
       height:min(74vh,620px);margin-top:12px}
.plate canvas{position:absolute;inset:0;width:100%;height:100%}
.plate .cap{position:absolute;left:26px;bottom:22px;z-index:3;max-width:36ch}
.plate .cap .t{font-family:var(--jak);font-weight:500;font-size:17px;color:var(--ink);margin:0 0 6px}
.plate .cap .d{font-size:12.5px;line-height:1.6;color:var(--ink2);margin:0}
.plate .tag{position:absolute;right:24px;top:20px;z-index:3;color:var(--ink3);
            font-family:var(--jak);font-weight:600;font-size:10px;letter-spacing:.15em;text-transform:uppercase}

/* ---------------- work ---------------- */
.work{padding:96px 0 40px}
/* filter tags: plain pills, the active one inked. Gold is only 1.6:1 here so the
   active state is the ink itself, knocked out to paper -- the same move as the grid. */
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 48px}
.tags button{font:500 13px var(--jak);letter-spacing:.01em;color:var(--ink);background:transparent;
  border:1px solid var(--hair);border-radius:999px;padding:9px 16px;cursor:pointer;
  transition:color .15s ease,border-color .15s ease,background .15s ease,transform .1s ease}
.tags button:hover{color:var(--ink);border-color:var(--ink3)}
.tags button:active{transform:scale(.96)}
.tags button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* the panel: titles left, preview right. Concentric: preview radius 20 = inner 14 + 6. */
/* his project page, off the screenshot: the titles ARE the page. Helvetica Neue Light
   at 44 with tight leading, one under the other, no numbers, no years, no rules. The
   preview lives on the right and only exists while a title is under the pointer, which
   is why his right half is empty at rest. Hovering one title quiets the others. */
.panel{display:grid;grid-template-columns:1.1fr 1fr;gap:64px;align-items:start;position:relative}
/* THE LEADER. The list is a table of contents, so the hovered title gets what a contents
   page gives a title: a dotted leader across the gap that lands on its page, with the year
   set at the end where the page number goes. It fills the space between the list and the
   card with the one thing that belongs there, the link between them. It draws in from the
   title, and turns a corner only when a row sits above or below the card. */
.leader{position:absolute;inset:0;pointer-events:none;overflow:visible;opacity:0;transition:opacity .16s ease}
.leader path{fill:none;stroke:var(--ink3);stroke-width:2;stroke-linecap:round;stroke-dasharray:0 6.5;
  animation:lead-flow .6s linear infinite}
/* the dots travel from the title to the card, one pitch per cycle so the run never skips */
@keyframes lead-flow{to{stroke-dashoffset:-6.5}}
@media (prefers-reduced-motion:reduce){.leader path{animation:none}}
.leader-clip{transition:clip-path .34s cubic-bezier(.2,.7,.2,1)}
.leader-yr{position:absolute;font:500 12px var(--jak);letter-spacing:.03em;color:var(--ink3);transform:translate(-100%,-50%);
  opacity:0;transition:opacity .2s ease .16s;pointer-events:none;white-space:nowrap}
.rows.hot~.leader{opacity:1}.rows.hot~.leader-yr{opacity:1}
.rows{list-style:none;margin:0;padding:0}
.rows a{display:inline-block;padding:2px 0;text-decoration:none;font:300 44px/1.15 var(--hel);letter-spacing:-.015em;
  color:var(--ink);transition:color .18s ease}
.rows.hot a{color:var(--ink3)}
.rows.hot li.on a{color:var(--ink)}
.rows li.off{display:none}
/* external work leaves the site: the arrow says so, quietly */
.rows .ext{display:inline-block;vertical-align:.55em;color:var(--ink3);margin-left:.12em;line-height:0}
.rows .ext svg{width:.36em;height:.36em}
/* THE PLATE IS EXACTLY THE FILE. Each project's plate takes that recording's own
   proportions, read off the file the moment it loads, and the media is fitted inside it
   whole: no crop, no zoom, no stretch. A 16:9 recording gets a 16:9 plate, a 2:1 gets 2:1.
   The plate changes shape between projects; that is the honest cost of showing each one
   at its own size. --ar is width over height. */
/* ONE CARD, ONE SIZE. His way: every card is the same fixed size, and the recording is
   fitted WHOLE inside a white inset plate, centred, whatever its own shape. The plate is
   16:9, which six of the eight recordings are; the two wider ones get a sliver of plate
   above and below, and the phone recordings sit in the middle of it the way his console
   does. The press turns each recording's canvas into paper, so plate and picture read as
   one surface and nothing is cropped, zoomed or stretched. The caption is a row under the
   plate, never on it. */
.preview{position:sticky;top:96px;border-radius:20px;padding:12px;
  background:var(--plate);outline:1px solid var(--outline);outline-offset:-1px;
  opacity:0;transform:translateY(6px);transition:opacity .28s ease,transform .32s cubic-bezier(.22,1,.36,1)}
.preview .stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:12px;background:var(--plate)}
[data-theme="dark"] .preview .stage{outline:1px solid var(--outline);outline-offset:-1px}
.preview.show{opacity:1;transform:none}
@media(max-width:900px){.rows a{font-size:32px}}
@media(max-width:640px){.rows a{font-size:26px}.tags{gap:6px;margin:16px 0 28px}.tags button{padding:7px 11px;font-size:12px}.pv-cap{padding:12px 4px 4px}.hero-foot{display:none}.work{padding-top:40px}}
/* THE GOLDEN RULE: every card has the same padding on all four sides, so the recording is
   fitted to the stage, never the stage to the recording. Cover, not contain: a recording
   that is not 16:9 loses a sliver at its edges rather than leaving a gap. */
.preview video,.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.preview video.on,.preview img.on{display:block}
/* THE CLIPS WERE SHOT FOR ANOTHER SITE. They carry that site's beige ground baked in, so
   laid flat they would read as pasted cards. Multiplied into the plate the beige becomes
   this paper, the white of a phone screen becomes the plate, and only the pigment of the
   work remains: the same rule as every wash on the page. Dark mode cannot multiply, so
   the clip sits on the lifted plate a little dimmed, with the grain doing the joining. */
/* saturate(.72): the old ground was #FFF5EF, and multiplied straight it leaves a peach

    if(e.detail.on){ const f=firstContent(); const top=f?f.getBoundingClientRect().top-peek:0; peek=Math.max(0,e.detail.bottom+20-top); }
    else peek=0;
    els.forEach(el=>{ el.classList.add('pushing'); el.style.transform=peek?`translateY(${peek.toFixed(1)}px)`:''; });

/* ---------- the loader: rules, stems, breath, sweep ---------- */
(function(){
  const host=document.getElementById('load'), row=document.getElementById('ld');
  if(!host||!row) return;
  const N=7, cells=[];
  for(let i=0;i<N;i++){
    const c=document.createElement('span'); c.className='lc';
    c.style.setProperty('--d',(380+i*70)+'ms');
    row.appendChild(c); cells.push(c);
  }
  /* every cell is oxblood or gold, dealt at random like the hero's tiles, with at
     least two of each so the bar never comes out one colour */
  let deal; do{ deal=cells.map(()=>Math.random()<.5); }while(deal.filter(Boolean).length<2||deal.filter(x=>!x).length<2);
  deal.forEach((g,i)=>{ if(g) cells[i].classList.add('g'); });
  const t0=performance.now(); let raf=0, inked=-1;
  function frame(now){
    const t=(now-t0)/1000;
    /* the hero's breath: each cell's share of the row rises and falls on its own phase */
    const W=row.clientWidth; let sum=0; const ws=[];
    for(let i=0;i<N;i++){const k=.5+.5*Math.sin(t*.9*Math.PI*2*.5+i*.74*1.7); const w=1+k*k*1.6; ws.push(w); sum+=w;}
    for(let i=0;i<N;i++) cells[i].style.width=(ws[i]/sum*W).toFixed(1)+'px';
    /* the sweep: from 1.0s, one more cell inks every 110ms and stays */
    const want=Math.min(N-1, Math.floor((t-1.0)/.11));
    while(inked<want){inked++; cells[inked].classList.add('on');}
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  /* leaves when the bar is full AND the page has loaded; never later than 2.6s */
  let left=false;
  const done=()=>{ if(left) return; left=true; host.classList.add('gone');
    setTimeout(()=>{ cancelAnimationFrame(raf); host.remove(); }, 560); };
  const go=()=>setTimeout(done, Math.max(0, 2000-(performance.now()-t0)));
  if(document.readyState==='complete') go(); else addEventListener('load', go);
  setTimeout(done, 2600);
})();

/* ---------- HERO letter grid, locked values ---------- */
const WORDS=["JAZLYNN","DESIGNER","PASSIONATE","CURIOUS","CHARMING","PLAYFUL","INTERACTION","COGNITION","ENGINEERING","NEWYORK"];
const SPEED=.23, DRIFT=.74;
/* FS follows the CSS row (0.85 of it) so the measured widths match what is drawn; the
   locked stretch of 84 at a 34px letter is kept as a ratio, 2.47 letters' worth */
let FS=34, STRETCH=84;
const gauge=document.createElement('canvas').getContext('2d');
const stack=document.getElementById('stack');
function measure(){
  /* THE WALL'S HEIGHT IS CAPPED. The block takes 88% of the hero's free height whatever
     the row count, and the remaining 12% is the air the golden split divides 1.618 : 1.
     Without this cap eleven rows swallowed the hero and the split had nothing to split;
     at the strict golden share (61.8%) the letters fell to the floor and looked lost.
     Rows stay between 38 and 72px. 70% and 80% both read as too small. */
  const N=WORDS.length, free=innerHeight-72-96-120;         /* hero min-height minus its paddings */
  /* on a narrow screen the longest word decides the row: its letters must fit the width at rest */
  const longest=Math.max(...WORDS.map(w=>w.length)), wide=(stack.getBoundingClientRect().width||innerWidth-60);
  const narrow=innerWidth<640; const per=narrow?1.25:0.62;   /* a letter's share of the row at full breath, so a phone row never spills */
  const fitPx=(wide-4*longest)/(longest*per)/0.9;
  const rowPx=Math.max(narrow?18:22,Math.min(72, (free*.88)/(N+(N-1)*.2), fitPx));
  document.documentElement.style.setProperty('--row',rowPx.toFixed(2)+'px');
  /* a custom property reads back as its declared text ("clamp(...)"), never as pixels,
     so the row is measured off a real cell */
  const probe=document.createElement('span'); probe.className='cell'; probe.style.cssText='position:absolute;visibility:hidden;width:1px';
  stack.appendChild(probe); const row=probe.getBoundingClientRect().height||40; probe.remove();
  FS=row*.9; STRETCH=FS*(innerWidth<640?0.9:2.47); gauge.font=`400 ${FS}px "Helvetica Neue",Helvetica,Arial,sans-serif`;
}
measure();
/* EVERY LETTER STANDS THE SAME DISTANCE FROM ITS LEFT WALL. The glyph is measured for
   where its ink actually starts, not where its advance box does: a G or an O has almost
   no side bearing and was touching the border, an I or an N had plenty and floated.
   The inset is the visible gap, so it is set on the ink and the base width grows by the
   padding so the cell never clips. */
function fit(o){
  const m=gauge.measureText(o.ch), ink=-(m.actualBoundingBoxLeft||0);
  const pad=Math.max(0, FS*.1-ink);
  o.glyph.style.paddingLeft=pad.toFixed(1)+'px';
  o.base=Math.ceil(m.width+pad)+4;
}
const lines=WORDS.map((w,li)=>{
  const el=document.createElement('div'); el.className='line';
  const cells=[...w].map((ch,ci)=>{
    const c=document.createElement('span'); c.className='cell';
    const s=document.createElement('span'); s.className='ch'; s.textContent=ch;
    c.appendChild(s); el.appendChild(c);
    /* each cell carries its OWN flicker schedule. One global timer picking a random
       cell would make the whole wall pulse together; per-cell clocks with random
       phases give an irregular scatter, which is what "occasionally" looks like. */
    const o={cell:c, glyph:s, ch, base:0, ci, next:2+Math.random()*22, until:0, lit:false, col:''};
    fit(o); return o;
  });
  stack.appendChild(el); return {cells, seed:li};
});
/* THE FURTHEST THE WALL CAN REACH. The cells breathe on their own phases, so the ragged
   edge is a range, not a place. One period of the cycle is sampled and the widest row kept,
   as unit x of the hero, plus a gutter. The sheets are laid out to the right of it. */
window.wallClear=function(){
  const hero=document.querySelector('.hero'); if(!hero) return 0;
  const hw=hero.getBoundingClientRect().width||innerWidth, sl=stack.getBoundingClientRect().left-hero.getBoundingClientRect().left;
  const period=1/SPEED; let widest=0;
  for(let n=0;n<120;n++){ const t=(n/120)*period;
    for(const L of lines){ let x=0; for(const c of L.cells){ const k=.5+.5*Math.sin(t*SPEED*Math.PI*2+L.seed*DRIFT+c.ci*DRIFT*1.7); x+=c.base+k*k*STRETCH; } if(x>widest) widest=x; } }
  return (sl+widest+28)/hw;

/* ============ INK: TWO BEHAVIOURS, ONE MECHANIC ==================================
 * A cell fills with gold or oxblood and its letter knocks out to paper. That part is
 * fixed: gold is 1.6:1 on this ground, so a gold LETTER would be invisible and the
 * only way the colour can appear inside type here is by inking the tile and reversing
 * the glyph.
 *
 * WHAT CHANGES IS WHY A CELL LIGHTS.
 *
 *   random  the first version. Sparse and pretty, and the wrong kind of motion for a
 *           masthead: random timing is the one pattern the eye cannot habituate to,
 *           because it keeps predicting and failing, so it never fades into the
 *           background the way a regular rhythm does within seconds. It also means
 *           nothing -- a cell going gold says nothing about that letter.
 *
 *   cursor  the same ink, caused. Cells near the pointer take colour. Now the motion
 *           is FEEDBACK rather than decoration: it says the wall is alive, and it
 *           teaches that without printing three verbs underneath it.
 *
 * Both open with the same ARRIVAL: the wall inks itself in once, over about two and a
 * half seconds, then settles. Motion that ends is far easier to forgive than motion
 * that never does, and it gets the palette on screen in the first moment either way.
 * ================================================================================= */
const FLICK = ['var(--flick-a)', 'var(--flick-b)'];
const LIT_MAX = 4;
const NEAR = 92;      // NEAR: pointer radius, in px (cursor mode only, retired)
/* LOCKED 2026-09-03: random. The cursor behaviour was tried and dropped. */
const mode = 'random'; let litNow = 0, t0 = 0, calm = 0;
let px = -9999, py = -9999;

/* the pointer in the stack's own coordinates. Read once per move rather than per
   cell: 75 getBoundingClientRect calls a frame is exactly the kind of thing that
   turns a smooth page into a slow one. */
stack.addEventListener('pointermove', (e) => {

  px = e.clientX - r.left; py = e.clientY - r.top;
});
stack.addEventListener('pointerleave', () => { px = py = -9999; });

/* colour is assigned ONCE per cell, not per lighting. Re-rolling it every time a cell
   lights makes a hovered word strobe between two hues, which is worse than either. */
lines.forEach(L => L.cells.forEach(c => { c.col = FLICK[(Math.random() * FLICK.length) | 0]; }));

function ink(c, on) {
  if (c.lit === on) return;              // the DOM is touched only on a real change
  c.lit = on;
  c.cell.style.background = on ? c.col : 'transparent';
  c.glyph.style.color = on ? 'var(--paper)' : '';
}

(function tick(now){
  const t=(now||0)/1000;
  if(!t0) t0 = t;
  const age = t - t0;
  /* THE ARRIVAL. A wave that crosses the wall once and is never seen again. */
  const arriving = age < 2.6;
  const front = age * 46;                // px per second, down and to the right
  /* THE WALL SETTLES. After the arrival the breath eases to rest and the random ink stops,
     so the headline can be read; it comes alive again while the pointer is over it. */
  const hovering = px > -9000;
  /* five seconds of life after the page is up, then a slow glide to rest over about three more */
  calm += (((age > 5 && !hovering) ? 1 : 0) - calm) * 0.008;

  for(const L of lines){
    let x = 0;                           // walk the row, accumulating the widths we set
    const cy = L.seed * (FS/.9*1.2) + FS/.9/2;
    for(const c of L.cells){
      /* LEFT-ALIGNED, ragged right. Each cell breathes on its own and the row is however
         long its letters make it: the varying line lengths ARE the composition. The
         justified version (every row the container's width) was tried and dropped. */
      const k=.5+.5*Math.sin(t*SPEED*Math.PI*2 + L.seed*DRIFT + c.ci*DRIFT*1.7);
      const w = c.base + (k*k*(1-calm) + 0.25*calm)*STRETCH;
      c.cell.style.width = w.toFixed(1)+'px';

      if(arriving){
        /* diagonal, so it reads as a sweep across the block rather than as eleven rows
           each doing their own thing */
        const d = x + w/2 + cy*0.6;
        ink(c, d < front && d > front - 130);
        x += w; continue;
      }
      if(mode === 'cursor'){
        const dx = (x + w/2) - px, dy = cy - py;
        ink(c, dx*dx + dy*dy < NEAR*NEAR);
      } else if(calm > 0.6){
        if(c.lit){ ink(c,false); litNow--; }
      } else {
        if(c.lit && t>c.until){ ink(c,false); litNow--; c.next = t + 6 + Math.random()*26; }
        else if(!c.lit && t>c.next){
          if(litNow>=LIT_MAX){ c.next = t + 1 + Math.random()*4; }
          else { ink(c,true); litNow++; c.until = t + 0.25 + Math.random()*0.9; }
        }
      }
      x += w;
    }
  }

})();

const V=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
function discs(cv, opts){
  const c=cv.getContext('2d'); let raf=0, t0=performance.now(), W=0,H=0,dpr=1, seed=0;
  const cols=[V('--gold'),V('--oxblood'),V('--charcoal'),V('--gold')];
  function size(){const r=cv.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);
    W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;c.setTransform(dpr,0,0,dpr,0,0);}

    const t=(now-t0)/1000;

    /* PAINT, NOT LIGHT. On paper the discs are washes: two crossing go DARKER, so the
       blend is multiply. Additive ('lighter') on a paper ground just bleaches the plate
       to white, which is what this replaces. In dark mode the ground is the dark room
       and transmitted light is the honest metaphor again, so it stays additive there.
       Pigment is diluted by how dark it is: oxblood at the gold's alpha kills the paper,
       so each colour carries its own weight in light mode. */
    const dark=document.documentElement.getAttribute('data-theme')==='dark';
    c.globalCompositeOperation=dark?'lighter':'multiply';
    const wt=dark?[1,1,1,1]:[1,.42,.5,1];
    const ah=(hex,w)=>Math.max(0,Math.min(255,Math.round(parseInt(hex,16)*w))).toString(16).padStart(2,'0');
    const R=Math.min(W,H)*opts.r;

      // the centre drifts, so successive discs land offset and cluster
      const a=i*2.399 + seed*0.9 + t*opts.spin;

      const x=W*.5+Math.cos(a)*(R*.5+wob), y=H*.5+Math.sin(a)*(R*.40+wob*.7);
      const rad=R*(.5+(i%4)*.19);
      const col=cols[i%cols.length], w=wt[i%cols.length];
      const g=c.createRadialGradient(x,y,0,x,y,rad);
      g.addColorStop(0,col+ah(opts.core,w)); g.addColorStop(.7,col+ah(opts.mid,w)); g.addColorStop(1,col+'00');

addEventListener('resize',()=>{ if(leadFor>=0) lead(leadFor,false); });
const hot=on=>{rows.classList.toggle('hot',on); preview.classList.toggle('show',on);
  if(!on){ [...rows.children].forEach(li=>li.classList.remove('on')); pvV.pause(); leadFor=-1; } else pvV.play().catch(()=>{});};
rows.addEventListener('pointerover',e=>{const a=e.target.closest('a'); const li=a&&a.closest('li'); if(li){show(+li.dataset.i); hot(true);} else if(!e.target.closest('a')) hot(false);});
rows.addEventListener('pointerleave',()=>hot(false));
rows.addEventListener('pointermove',e=>{ if(!e.target.closest('a')) hot(false); },{passive:true});
rows.addEventListener('focusin',e=>{const li=e.target.closest('li'); if(li){show(+li.dataset.i); hot(true);}});
rows.addEventListener('focusout',e=>{if(!rows.contains(e.relatedTarget)) hot(false);});
tags.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  [...tags.children].forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true');
  const t=b.textContent; let first=-1;
  [...rows.children].forEach((li,j)=>{const off=t!=='All'&&!li.dataset.tags.split('|').includes(t);
    li.classList.toggle('off',off); if(!off&&first<0) first=j;});
  if(first>=0) show(first);
});

/* ---------- footer clock: hers is New York ---------- */
(function(){const els=document.querySelectorAll('.clock'); if(!els.length) return;
  const f=()=>{const t=new Date().toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit',second:'2-digit',timeZoneName:'short'}); els.forEach(el=>el.textContent=t);};

<script>
/* ---------- the latest marks: fetched when the strip comes into view ---------- */
(function(){
  const row=document.getElementById('marks-row'); if(!row) return;
  const STOCK={gold:'#A99939',oxblood:'#340414',charcoal:'#1C1A17',paper:'#FAF9F7'};
  const OLD={orange:'gold',blue:'charcoal',clay:'oxblood',green:'gold',purple:'oxblood'};
  const tone=c=>STOCK[c]?c:(OLD[c]||['gold','oxblood','charcoal','paper'][(String(c||'').length+3)%4]);
  const INK=c=>tone(c)==='paper'?'#14171B':'#FAF9F7';
  const esc=s=>String(s||'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  /* a drawing from the old site has its ground baked in; it is read as strokes in the card's ink */
  function reink(img){ try{ const w=img.naturalWidth,h=img.naturalHeight; if(!w) return; const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.drawImage(img,0,0);
    const d=x.getImageData(0,0,w,h), px=d.data; if(px[3]<250||px[(w-1)*4+3]<250||px[(h-1)*w*4+3]<250||px[(w*h-1)*4+3]<250) return;
    const ink=img.dataset.ink, r=parseInt(ink.slice(1,3),16), g=parseInt(ink.slice(3,5),16), b=parseInt(ink.slice(5,7),16);
    for(let i=0;i<px.length;i+=4){ const l=(0.299*px[i]+0.587*px[i+1]+0.114*px[i+2]); const a=Math.max(0,Math.min(255,(120-l)*3)); px[i]=r; px[i+1]=g; px[i+2]=b; px[i+3]=a; }
    x.putImageData(d,0,0); img.src=c.toDataURL(); }catch(e){} }
  const N=12; for(let i=0;i<N;i++){ const e=document.createElement('div'); e.innerHTML='<div class="card empty"></div><span class="who">&nbsp;</span>'; row.appendChild(e); }
  (function stock(){
    const N=256, cv=document.createElement('canvas'); cv.width=cv.height=N; const c=cv.getContext('2d');
    const hash=(x,y,s)=>{ const n=Math.sin((x%N)*127.1+(y%N)*311.7+s*74.7)*43758.5453; return n-Math.floor(n); };
    const swell=(x,y,f,ph)=>Math.sin((x/N)*6.2832*f+ph)*Math.sin((y/N)*6.2832*f+ph*1.7);
    const h=new Float32Array(N*N);
    for(let y=0;y<N;y++) for(let x=0;x<N;x++) h[y*N+x]=(hash(x,y,6)-.5)*.2+(hash(x>>1,y>>1,12)-.5)*.26+swell(x,y,3,.2)*.08;
    const L=[-0.58,-0.66,0.48], m=Math.hypot(...L); L[0]/=m; L[1]/=m; L[2]/=m;
    const at=(x,y)=>h[((y+N)%N)*N+((x+N)%N)];
    const img=c.createImageData(N,N), d=img.data;
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      const dx=(at(x+1,y)-at(x-1,y))*46, dy=(at(x,y+1)-at(x,y-1))*46, nz=1, nm=Math.hypot(dx,dy,nz);
      const diff=Math.max(0,(-dx/nm)*L[0]+(-dy/nm)*L[1]+(nz/nm)*L[2]);
      /* a breath of relief, not a rasp: the lab's postcard sits at about a third of this gain's first cut */
      const v=Math.max(0,Math.min(255,128+(diff-0.74)*110));
      const o=(y*N+x)*4; d[o]=d[o+1]=d[o+2]=v; d[o+3]=255;
    }
    c.putImageData(img,0,0);
    document.documentElement.style.setProperty('--stock',`url(${cv.toDataURL()})`);
  })();
  let done=false;
  async function fill(){ if(done) return; done=true;
    let cards=[]; try{ const r=await fetch('/api/gallery/cards',{cache:'no-store'}); const j=await r.json(); cards=(Array.isArray(j.cards)?j.cards:[]).slice(0,N); }catch(e){}
    if(!cards.length) return;
    row.innerHTML='';
    const one=(c,i)=>{ const cell=document.createElement('div');
      cell.innerHTML=`<div class="card" style="background:${STOCK[tone(c.color)]}"><img src="${c.drawing}" alt="" data-ink="${INK(c.color)}"><span class="mono" style="color:${INK(c.color)}">JK</span></div><span class="who" title="${esc(c.name)}">${esc(c.name)}</span>`;
      cell.querySelector('img').addEventListener('load',e=>reink(e.target),{once:true}); row.appendChild(cell);
      setTimeout(()=>cell.querySelector('.card').classList.add('in'),80+i*60); };
    /* the belt is the cards twice over, so the loop closes on itself; the speed follows its length */
    cards.forEach(one); cards.forEach(one);
    row.style.setProperty('--belt',(cards.length*4)+'s');
  }
  window.__fillMarks=fill;
  if('IntersectionObserver' in window){ const io=new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)){ fill(); io.disconnect(); } },{rootMargin:'400px'}); io.observe(row); } else fill();
})();
</script>
<script>
/* ---------- the sheet: a case study over the home ---------- */
(function(){
  const CASES=PROJECTS.filter(p=>p.href.startsWith('/work/')).map(p=>({t:p.t,slug:p.href.replace('/work/','').replace('.html','')}));
  if(!CASES.length) return;
  const bg=document.createElement('div'); bg.className='sheet-bg';
  const tabs=document.createElement('div'); tabs.className='sheet-tabs'; tabs.setAttribute('role','tablist');
  tabs.innerHTML=CASES.map(c=>`<button role="tab" data-slug="${c.slug}" aria-pressed="false">${c.t}</button>`).join('');
  const sheet=document.createElement('div'); sheet.className='sheet'; sheet.setAttribute('role','dialog'); sheet.setAttribute('aria-modal','true');
  sheet.innerHTML=`<div class="sheet-bar"></div><div class="sheet-act"><button id="sheet-full" title="Expand" aria-label="Expand" aria-pressed="false"><svg class="i-out" viewBox="0 0 16 16"><path d="M3 6.5V3h3.5M13 9.5V13H9.5M13 3 9 7M3 13l4-4M13 3H9.5M13 3v3.5M3 13h3.5M3 13V9.5"/></svg><svg class="i-in" viewBox="0 0 16 16"><path d="M7 3v4H3M9 13V9h4M3 3l4 4M13 13 9 9"/></svg></button><button id="sheet-close" title="Close" aria-label="Close"><svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button></div><iframe title="Case study"></iframe>`;
  let mounted=false, cur=null, restoreY=0;
  function mount(){ if(mounted) return; mounted=true; document.body.append(bg,tabs,sheet); }
  /* ONE CURSOR. The case study inside the frame draws its own dot, and the home cannot see the
     pointer while it is in there, so the home's dot would freeze at the frame's edge as a second
     cursor. The home hides its dot whenever the pointer is in the frame and shows it again on
     the first move it can see, over the tabs or the backdrop. */
  const fr=sheet.querySelector('iframe');
  fr.addEventListener('pointerenter',()=>document.documentElement.classList.add('cur-away'));
  addEventListener('pointermove',()=>document.documentElement.classList.remove('cur-away'),{passive:true});
  function show(slug,push){
    mount(); const c=CASES.find(x=>x.slug===slug); if(!c) return; document.documentElement.classList.add('cur-away');
    if(cur!==slug){ sheet.querySelector('iframe').src=`/work/${slug}.html?sheet=1`; cur=slug; }
    [...tabs.children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.slug===slug)));
    if(!document.documentElement.classList.contains('sheet-open')){ restoreY=scrollY; document.documentElement.classList.add('sheet-open'); }
    if(push) history.pushState({sheet:slug},'',`/?p=${slug}`);
    document.title=c.t+' \u00b7 Jazlynn Kurniandra';
  }
  function hide(push){ if(!document.documentElement.classList.contains('sheet-open')) return;
    document.documentElement.classList.remove('sheet-open','sheet-full'); const fb=sheet.querySelector('#sheet-full'); fb.setAttribute('aria-pressed','false'); fb.title=fb.ariaLabel='Expand';
    /* closing a case study lands on the projects list, never back up at the hero */
    toWork();
    [...tabs.children].forEach(b=>b.setAttribute('aria-pressed','false'));
    if(push) history.pushState({},'','/'); document.title='Jazlynn Kurniandra';
    setTimeout(()=>{ if(!document.documentElement.classList.contains('sheet-open')){ sheet.querySelector('iframe').src='about:blank'; cur=null; } },400); }
  /* the rows open the sheet; external work and the placeholders still go where they went */
  rows.addEventListener('click',e=>{ const a=e.target.closest('a'); if(!a) return; const h=a.getAttribute('href')||'';
    if(!h.startsWith('/work/')||e.metaKey||e.ctrlKey||e.shiftKey||e.button) return; e.preventDefault(); show(h.replace('/work/','').replace('.html',''),true); });
  tabs.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) show(b.dataset.slug,true); });
  bg.addEventListener('click',()=>hide(true));
  sheet.addEventListener('click',e=>{ if(e.target.closest('#sheet-close')) hide(true);
    if(e.target.closest('#sheet-full')){ const on=!document.documentElement.classList.contains('sheet-full');
      document.documentElement.classList.toggle('sheet-full',on); const b=e.target.closest('#sheet-full');
      b.setAttribute('aria-pressed',String(on)); b.title=b.ariaLabel=on?'Collapse':'Expand'; } });
  addEventListener('keydown',e=>{ if(e.key==='Escape') hide(true); });
  addEventListener('popstate',()=>{ const p=new URLSearchParams(location.search).get('p'); if(p) show(p,false); else hide(false); });
  function toWork(smooth){ const w=document.getElementById('work'); if(!w) return;
    const go=()=>{ document.documentElement.style.scrollBehavior=smooth?'smooth':'auto'; scrollTo(0,w.offsetTop-40); document.documentElement.style.scrollBehavior=''; window.__heroApply&&window.__heroApply(); };
    go(); if(!smooth){ requestAnimationFrame(go); setTimeout(go,350); } else setTimeout(()=>{ if(Math.abs(scrollY-(w.offsetTop-40))>4) go(); },900); }
  window.toWork=toWork;
  document.querySelectorAll('a[href="#work"],a[href="/#work"]').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); history.replaceState(null,'','#work'); toWork(true); }));
  if(location.hash==='#work'){ toWork(false); addEventListener('load',()=>toWork(false),{once:true}); }
  /* arriving on a case study link: the list is what waits behind the sheet, and what remains when it closes */
  const p0=new URLSearchParams(location.search).get('p'); if(p0){ toWork(); addEventListener('load',toWork,{once:true}); show(p0,false); }
})();
</script>
<script>
/* ---------- the scroll: engulf the hero, fade the hint, pin the rail ---------- */
(function(){
  const hero=document.querySelector('.hero'), stack=document.getElementById('stack'),
        sheets=document.getElementById('sheets'), hint=document.querySelector('.hint');
  if(!hero||!stack||!sheets) return;
  let raf=0;
  function apply(){
    raf=0;
    const h=hero.offsetHeight||innerHeight;
    /* THE HERO STAYS UNTIL IT IS COVERED. It used to be gone by two thirds of the scroll,
       so the projects always rose over blank paper. Now nothing fades until the projects
       have climbed past the hero's midpoint, and the last of it goes only as they cover
       it: the discs and the wall are still there under the cap as the list arrives. */
    const p=Math.max(0,Math.min(1,(scrollY-h*.55)/(h*.45)));
    const e=p*p*(3-2*p);
    const ph=Math.max(0,Math.min(1,scrollY/(h*.66)));   /* the hint keeps its own, earlier clock */
    document.querySelector('nav').classList.toggle('grounded',scrollY>h*.35);
    sheets.style.opacity=(1-e).toFixed(3);
    stack.style.opacity=(1-e).toFixed(3);
    stack.style.transform=`translateY(${(-e*48).toFixed(1)}px)`;
    /* the hint goes first: it is an instruction, and the reader has followed it */
    /* full ink until the reader has actually started down, then it goes first */
    if(hint){ const o=Math.max(0,1-Math.max(0,ph-.14)*3); hint.style.opacity=o.toFixed(3); hint.style.visibility=o>0?'':'hidden'; }
  }
  const tick=()=>{ if(!raf) raf=requestAnimationFrame(apply); };
  addEventListener('scroll',tick,{passive:true}); addEventListener('resize',tick); apply();
  window.__heroApply=apply;   /* so a test can drive the scroll engulf without a frame */
})();
</script>
